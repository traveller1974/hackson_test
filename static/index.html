<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订阅管家 SubScribe Butler</title>
<style>
  :root {
    --bg: #0b0f1a; --panel: #131a2b; --card: #1a2236; --border: #263048;
    --text: #e8ebf4; --muted: #8b93a7; --accent: #4f8cff; --accent2: #00c48c;
    --danger: #ff5c7a; --warn: #ffb84d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 800px at 80% -10%, #16203a 0%, var(--bg) 55%);
    color: var(--text); font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, sans-serif;
    height: 100vh; overflow: hidden;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: rgba(19,26,43,.6); backdrop-filter: blur(8px); }
  header .logo { font-size: 22px; }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { margin-left: auto; font-size: 11px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.mock { color: var(--warn); border-color: #5a4a2a; }
  .badge.sandbox { color: var(--accent2); border-color: #1d5c49; }
  main { display: grid; grid-template-columns: 1fr 420px; gap: 16px; padding: 16px 24px; height: calc(100vh - 59px); }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; overflow-y: auto; height: auto; min-height: calc(100vh - 59px); } body { overflow: auto; } }

  /* ---------- 聊天区 ---------- */
  .chat { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; min-height: 0; }
  .chat .log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 84%; padding: 11px 15px; border-radius: 14px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), #3f74e0); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot .engine { display: block; margin-top: 8px; font-size: 10px; color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 10px; }
  .chip { font-size: 12px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); cursor: pointer; user-select: none; transition: .15s; }
  .chip:hover { color: var(--accent); border-color: var(--accent); background: rgba(79,140,255,.08); }
  .chip.danger:hover { color: var(--danger); border-color: var(--danger); background: rgba(255,92,122,.08); }
  .chat .input { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); }
  .chat input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; color: var(--text); font-size: 14px; outline: none; transition: border-color .15s; }
  .chat input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,.12); }
  .chat button.send { background: linear-gradient(135deg, var(--accent), #3f74e0); color: #fff; border: none; border-radius: 12px; padding: 0 22px; font-size: 14px; font-weight: 600; cursor: pointer; transition: .15s; }
  .chat button.send:hover { filter: brightness(1.1); }
  .chat button.send:disabled { opacity: .5; cursor: default; }

  /* ---------- 仪表盘 ---------- */
  .dash { overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; position: relative; overflow: hidden; }
  .stat::after { content: ""; position: absolute; right: -20px; top: -20px; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, rgba(79,140,255,.14), transparent 70%); }
  .stat .label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .stat .value { font-size: 26px; font-weight: 700; margin-top: 8px; letter-spacing: .3px; }
  .stat .value small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
  .panel h2 { font-size: 13px; margin-bottom: 14px; color: var(--muted); font-weight: 500; letter-spacing: .5px; }

  /* 环形图 */
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut { position: relative; width: 128px; height: 128px; flex-shrink: 0; }
  .donut svg { transform: rotate(-90deg); }
  .donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut .center b { font-size: 17px; letter-spacing: .3px; }
  .donut .center span { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .legend .li { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 3px; flex-shrink: 0; }
  .legend .nm { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend .v { margin-left: auto; color: var(--muted); white-space: nowrap; }

  /* 订阅卡片 */
  .sub-card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; transition: .15s; }
  .sub-card:hover { border-color: #33405f; }
  .sub-card.off { opacity: .48; }
  .avatar { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff; flex-shrink: 0; letter-spacing: .5px; }
  .sub-card .info { flex: 1; min-width: 0; }
  .sub-card .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .sub-card .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .status { font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight: 500; }
  .status.on { color: var(--accent2); background: rgba(0,196,140,.12); }
  .status.off2 { color: var(--muted); background: rgba(139,147,167,.12); }
  .status.pend { color: var(--warn); background: rgba(255,184,77,.12); }
  .sub-card .price { font-size: 15px; font-weight: 700; white-space: nowrap; }
  .sub-card .price small { font-size: 10px; color: var(--muted); font-weight: 400; }
  .sub-card .cancel { background: none; border: 1px solid var(--danger); color: var(--danger); border-radius: 9px; padding: 6px 11px; font-size: 12px; cursor: pointer; transition: .15s; white-space: nowrap; }
  .sub-card .cancel:hover { background: var(--danger); color: #fff; }
  .sub-card .cancel.confirming { background: var(--danger); color: #fff; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 22px 0; }
</style>
</head>
<body>
<header>
  <span class="logo">🛎️</span>
  <div>
    <h1>订阅管家 SubScribe Butler</h1>
    <div class="sub">PayPal 订阅，一句话管好</div>
  </div>
  <span class="badge" id="modeBadge">…</span>
</header>
<main>
  <section class="chat">
    <div class="log" id="log"></div>
    <div class="chips" id="chips"></div>
    <div class="input">
      <input id="textbox" placeholder="试试：「这个月花了多少？」「取消 MusicBox」「怎么省钱？」" autofocus>
      <button class="send" id="sendBtn">发送</button>
    </div>
  </section>
  <aside class="dash">
    <div class="stat-row">
      <div class="stat"><div class="label">💰 本月订阅开销</div><div class="value" id="total">-</div></div>
      <div class="stat"><div class="label">🔄 生效订阅数</div><div class="value" id="count">-</div></div>
    </div>
    <div class="panel"><h2>开销分布</h2>
      <div class="donut-wrap">
        <div class="donut" id="donut"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div class="panel"><h2>我的订阅</h2><div id="subList"></div></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const COLORS = ["#4f8cff", "#00c48c", "#ffb84d", "#b07cff", "#ff7a9c", "#35d0e8"];
const CUR_SYMBOL = { USD: "$", CNY: "¥", EUR: "€", GBP: "£" };
const fmt = (v, cur) => (CUR_SYMBOL[cur] || "") + v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const STATUS_LABEL = { ACTIVE: "生效中", CANCELLED: "已取消", APPROVAL_PENDING: "待确认", SUSPENDED: "已暂停" };
const STATUS_CLS = { ACTIVE: "on", CANCELLED: "off2", APPROVAL_PENDING: "pend", SUSPENDED: "pend" };
let history = [];
let lastSubs = [];

function addMsg(text, who, engine) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  if (engine) {
    const tag = document.createElement("span");
    tag.className = "engine";
    tag.textContent = engine === "llm" ? "🤖 LLM Agent" : "📐 规则引擎（未配置 LLM Key，已自动降级）";
    div.appendChild(tag);
  }
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
}

async function send(text) {
  text = (text || $("textbox").value).trim();
  if (!text) return;
  $("textbox").value = "";
  addMsg(text, "user");
  $("sendBtn").disabled = true;
  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, history})
    });
    const data = await resp.json();
    addMsg(data.reply, "bot", data.engine);
    history.push({role: "user", content: text}, {role: "assistant", content: data.reply});
    loadDashboard();
  } catch (e) {
    addMsg("网络出错，请重试。", "bot");
  } finally {
    $("sendBtn").disabled = false;
    $("textbox").focus();
  }
}

/* 快捷操作：基础问题 + 按真实订阅动态生成「取消 xx」 */
function renderChips() {
  const chips = ["我有哪些订阅？", "这个月订阅花了多少？", "最近扣款记录", "怎么省钱？"];
  const base = chips.map(q => `<span class="chip" data-q="${q}">${q}</span>`);
  const dyn = lastSubs.filter(s => s.status === "ACTIVE").slice(0, 2)
    .map(s => `<span class="chip danger" data-q="取消 ${s.name}">取消 ${s.name}</span>`);
  $("chips").innerHTML = base.concat(dyn).join("");
  $("chips").querySelectorAll(".chip").forEach(el => el.onclick = () => send(el.dataset.q));
}

function renderDonut(subs, currency) {
  // 多分类时按分类，只有一个分类时按服务名，分布图始终有内容可看
  const groups = {};
  subs.forEach(s => {
    const key = new Set(subs.map(x => x.category)).size > 1 ? s.category : s.name;
    groups[key] = (groups[key] || 0) + s.monthly_amount;
  });
  const entries = Object.entries(groups).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((t, [, v]) => t + v, 0);
  if (!total) {
    $("donut").innerHTML = `<div class="empty" style="width:128px">暂无数据</div>`;
    $("legend").innerHTML = "";
    return;
  }
  const R = 52, C = 2 * Math.PI * R;
  let offset = 0;
  const segs = entries.map(([k, v], i) => {
    const frac = v / total, dash = (frac * C).toFixed(2);
    const seg = `<circle cx="64" cy="64" r="${R}" fill="none" stroke="${COLORS[i % COLORS.length]}"
      stroke-width="14" stroke-dasharray="${dash} ${(C - dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"></circle>`;
    offset += frac * C;
    return seg;
  }).join("");
  $("donut").innerHTML = `<svg width="128" height="128" viewBox="0 0 128 128">${segs}</svg>
    <div class="center"><b>${fmt(total, currency)}</b><span>每月</span></div>`;
  $("legend").innerHTML = entries.map(([k, v], i) =>
    `<div class="li"><span class="dot" style="background:${COLORS[i % COLORS.length]}"></span>
     <span class="nm">${k}</span><span class="v">${fmt(v, currency)} · ${(v / total * 100).toFixed(0)}%</span></div>`).join("");
}

async function loadDashboard() {
  const data = await (await fetch("/api/subscriptions")).json();
  const badge = $("modeBadge");
  badge.textContent = data.mode === "mock" ? "演示数据模式" : "PayPal Sandbox 已连接";
  badge.className = "badge " + (data.mode === "mock" ? "mock" : "sandbox");

  lastSubs = data.subscriptions;
  $("total").innerHTML = fmt(data.monthly_total, data.currency) + "<small>/月</small>";
  $("count").textContent = data.active_count;
  renderDonut(data.subscriptions.filter(s => s.status === "ACTIVE"), data.currency);
  renderChips();

  $("subList").innerHTML = data.subscriptions.map((s, i) => {
    const hue = [...s.name].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
    const initial = s.name.replace(/[^A-Za-z0-9\u4e00-\u9fa5]/g, "").slice(0, 2).toUpperCase() || "?";
    const meta = s.status === "ACTIVE"
      ? `${s.category} · 下次扣款 ${s.next_billing_date || "待生成"}`
      : `${s.category} · ${s.status === "APPROVAL_PENDING" ? "等待买家确认" : "不再扣款"}`;
    const price = fmt(s.monthly_amount, s.currency);
    return `<div class="sub-card ${s.status !== "ACTIVE" ? "off" : ""}">
       <div class="avatar" style="background:linear-gradient(135deg, hsl(${hue} 65% 52%), hsl(${(hue + 40) % 360} 65% 42%))">${initial}</div>
       <div class="info">
         <div class="name">${s.name}<span class="status ${STATUS_CLS[s.status] || "off2"}">${STATUS_LABEL[s.status] || s.status}</span></div>
         <div class="meta">${meta}</div>
       </div>
       <span class="price">${price}<small>/月</small></span>
       ${s.status === "ACTIVE" ? `<button class="cancel" data-id="${s.id}" data-name="${s.name}">取消</button>` : ""}
     </div>`;
  }).join("") || `<div class="empty">暂无订阅</div>`;

  $("subList").querySelectorAll(".cancel").forEach(btn => {
    btn.onclick = () => {
      if (btn.classList.contains("confirming")) doCancel(btn.dataset.id, btn.dataset.name);
      else {
        btn.classList.add("confirming"); btn.textContent = "确认取消？";
        setTimeout(() => { btn.classList.remove("confirming"); btn.textContent = "取消"; }, 3000);
      }
    };
  });
}

async function doCancel(id, name) {
  addMsg(`取消 ${name}`, "user");
  try {
    const resp = await fetch(`/api/cancel/${id}`, {method: "POST"});
    const data = await resp.json();
    addMsg(data.ok ? `✅ 已取消「${name}」，之后不会再扣款了。` : `取消失败：${data.error || "未知错误"}`, "bot");
  } catch (e) {
    addMsg("网络出错，请重试。", "bot");
  }
  loadDashboard();
  setTimeout(loadDashboard, 2500);  // 缓存异步刷新后再同步一次，确保状态翻转显示
}

addMsg("你好！我是订阅管家 🛎️\n我可以帮你查订阅、算开销、取消订阅、给出省钱建议——右侧仪表盘会实时同步。", "bot");
loadDashboard();
</script>
</body>
</html>

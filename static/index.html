<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订阅管家 SubScribe Butler</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b27; --card: #1c2333; --border: #2a3145;
    --text: #e6e9f2; --muted: #8b93a7; --accent: #4f8cff; --accent2: #00c48c; --danger: #ff5c7a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; height: 100vh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--border); }
  header .logo { font-size: 20px; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  .badge { margin-left: auto; font-size: 11px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.mock { color: #ffb84d; border-color: #5a4a2a; }
  .badge.sandbox { color: var(--accent2); border-color: #1d5c49; }
  main { display: grid; grid-template-columns: 1fr 400px; gap: 16px; padding: 16px 24px; height: calc(100vh - 57px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; overflow-y: auto; } }

  /* 聊天区 */
  .chat { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .chat .log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; line-height: 1.65; font-size: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot.engine { display: block; margin-top: 6px; font-size: 10px; color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 10px; }
  .chip { font-size: 12px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); cursor: pointer; user-select: none; }
  .chip:hover { color: var(--accent); border-color: var(--accent); }
  .chat .input { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); }
  .chat input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 14px; outline: none; }
  .chat input:focus { border-color: var(--accent); }
  .chat button.send { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 20px; font-size: 14px; cursor: pointer; }
  .chat button.send:disabled { opacity: .5; cursor: default; }

  /* 仪表盘 */
  .dash { overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 24px; font-weight: 700; margin-top: 6px; }
  .stat .value small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .panel h2 { font-size: 14px; margin-bottom: 12px; color: var(--muted); font-weight: 500; }
  .bar-row { margin-bottom: 8px; }
  .bar-row .meta { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .bar-row .track { height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: linear-gradient(90deg, var(--accent), #7aa8ff); border-radius: 4px; }
  .sub-card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .sub-card.off { opacity: .45; }
  .sub-card .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); flex-shrink: 0; }
  .sub-card.off .dot { background: var(--muted); }
  .sub-card .info { flex: 1; min-width: 0; }
  .sub-card .name { font-size: 14px; font-weight: 600; }
  .sub-card .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .sub-card .price { font-size: 14px; font-weight: 700; }
  .sub-card .cancel { background: none; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .sub-card .cancel:hover { background: var(--danger); color: #fff; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<header>
  <span class="logo">🛎️</span>
  <div>
    <h1>订阅管家 SubScribe Butler</h1>
    <div class="sub">PayPal 订阅，一句话管好</div>
  </div>
  <span class="badge" id="modeBadge">…</span>
</header>
<main>
  <section class="chat">
    <div class="log" id="log"></div>
    <div class="chips" id="chips"></div>
    <div class="input">
      <input id="textbox" placeholder="试试：「这个月花了多少？」「取消 Spotify」「怎么省钱？」" autofocus>
      <button class="send" id="sendBtn">发送</button>
    </div>
  </section>
  <aside class="dash">
    <div class="stat-row">
      <div class="stat"><div class="label">本月订阅开销</div><div class="value" id="total">-<small> 元</small></div></div>
      <div class="stat"><div class="label">生效订阅数</div><div class="value" id="count">-</div></div>
    </div>
    <div class="panel"><h2>开销分类占比</h2><div id="bars"></div></div>
    <div class="panel"><h2>我的订阅</h2><div id="subList"></div></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const QUICK_ASKS = ["我有哪些订阅？", "这个月订阅花了多少？", "最近扣款记录", "怎么省钱？", "取消 iQIYI 黄金会员"];
let history = [];

function addMsg(text, who, engine) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  if (engine) {
    const tag = document.createElement("span");
    tag.className = "engine";
    tag.textContent = engine === "llm" ? "🤖 LLM Agent" : "📐 规则引擎（未配置 LLM Key）";
    div.appendChild(tag);
  }
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
}

async function send(text) {
  text = (text || $("textbox").value).trim();
  if (!text) return;
  $("textbox").value = "";
  addMsg(text, "user");
  $("sendBtn").disabled = true;
  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, history})
    });
    const data = await resp.json();
    addMsg(data.reply, "bot", data.engine);
    history.push({role: "user", content: text}, {role: "assistant", content: data.reply});
    loadDashboard();
  } catch (e) {
    addMsg("网络出错，请重试。", "bot");
  } finally {
    $("sendBtn").disabled = false;
    $("textbox").focus();
  }
}

async function loadDashboard() {
  const data = await (await fetch("/api/subscriptions")).json();
  const badge = $("modeBadge");
  badge.textContent = data.mode === "mock" ? "演示数据模式" : "PayPal Sandbox";
  badge.className = "badge " + (data.mode === "mock" ? "mock" : "sandbox");
  $("total").innerHTML = data.monthly_total.toLocaleString() + "<small> 元/月</small>";
  $("count").textContent = data.active_count;

  const cats = {};
  data.subscriptions.filter(s => s.status === "ACTIVE").forEach(s => cats[s.category] = (cats[s.category] || 0) + s.monthly_amount);
  const max = Math.max(...Object.values(cats), 1);
  $("bars").innerHTML = Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v]) =>
    `<div class="bar-row"><div class="meta"><span>${k}</span><span>${v.toFixed(2)} 元</span></div>
     <div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div></div>`
  ).join("") || `<div class="empty">暂无生效订阅</div>`;

  $("subList").innerHTML = data.subscriptions.map(s =>
    `<div class="sub-card ${s.status !== "ACTIVE" ? "off" : ""}">
       <span class="dot"></span>
       <div class="info">
         <div class="name">${s.name}</div>
         <div class="meta">${s.category} · ${s.status === "ACTIVE" ? "下次扣款 " + s.next_billing_date : "已取消"}</div>
       </div>
       <span class="price">${s.monthly_amount.toFixed(2)}</span>
       ${s.status === "ACTIVE" ? `<button class="cancel" onclick="doCancel('${s.id}')">取消</button>` : ""}
     </div>`
  ).join("") || `<div class="empty">暂无订阅</div>`;
}

async function doCancel(id) {
  if (!confirm("确认取消该订阅？")) return;
  await fetch(`/api/cancel/${id}`, {method: "POST"});
  loadDashboard();
}

QUICK_ASKS.forEach(q => {
  const chip = document.createElement("span");
  chip.className = "chip"; chip.textContent = q;
  chip.onclick = () => send(q);
  $("chips").appendChild(chip);
});
$("sendBtn").onclick = () => send();
$("textbox").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

addMsg("你好！我是订阅管家 🛎️\n我可以帮你查订阅、算开销、取消订阅、给出省钱建议。右侧是你的订阅仪表盘。", "bot");
loadDashboard();
</script>
</body>
</html>
